; Limites por diretório para PHP CGI/LiteSpeed da Hostinger.
; O container Apache mantém docker/php-uploads.ini.
upload_max_filesize = 12M
post_max_size = 14M
memory_limit = 256M
max_file_uploads = 10
display_errors = Off
log_errors = On
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
